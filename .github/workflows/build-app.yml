name: Build Boykt VPN App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'

    - name: Create Project and Inject Code
      run: |
        flutter create --org com.boykt.vpn --project-name boykt_vpn_app my_vpn
        cd my_vpn
        flutter pub add flutter_v2ray
        flutter pub add shared_preferences
        flutter pub add http
        
        # تحديث إصدار الأندرويد وصلاحيات الشبكة
        sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle
        sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml
        
        # كتابة كود التطبيق المطور بالكامل
        cat << 'EOF' > lib/main.dart
        import 'package:flutter/material.dart';
        import 'package:flutter_v2ray/flutter_v2ray.dart';
        import 'package:shared_preferences/shared_preferences.dart';
        import 'package:http/http.dart' as http;
        import 'dart:convert';
        import 'dart:async';

        void main() => runApp(const BoyktVpnApp());

        class BoyktVpnApp extends StatelessWidget {
          const BoyktVpnApp({super.key});

          @override
          Widget build(BuildContext context) {
            return MaterialApp(
              debugShowCheckedModeBanner: false,
              title: 'boykt vpn',
              theme: ThemeData.dark().copyWith(
                scaffoldBackgroundColor: const Color(0xFF0B0F19),
              ),
              home: const VpnScreen(),
            );
          }
        }

        class VpnScreen extends StatefulWidget {
          const VpnScreen({super.key});

          @override
          State<VpnScreen> createState() => _VpnScreenState();
        }

        class _VpnScreenState extends State<VpnScreen> {
          late final FlutterV2ray flutterV2ray;
          bool isConnected = false;
          bool isConnecting = false;
          
          List<Map<String, String>> servers = [];
          int selectedServerIndex = 0;
          Map<int, String> serverPings = {}; // لتخزين قياس البينغ لكل سيرفر
          
          int titleTapCount = 0;
          
          Timer? _timer;
          int _secondsConnected = 0;
          bool _timerActive = false;

          @override
          void initState() {
            super.initState();
            flutterV2ray = FlutterV2ray(
              onStatusChanged: (status) {
                bool newState = status.state == 'CONNECTED';
                setState(() {
                  isConnected = newState;
                  isConnecting = status.state == 'CONNECTING';
                });
                
                if (isConnected && !_timerActive) {
                  startTimer();
                } else if (!isConnected && _timerActive) {
                  stopTimer();
                }
              },
            );
            initVpn();
            loadInitialServers();
          }

          Future<void> initVpn() async {
            await flutterV2ray.initializeV2Ray();
          }

          // تحميل فوري من الذاكرة المحلية أولاً (حتى بدون إنترنت) ثم التحديث من السحاب
          Future<void> loadInitialServers() async {
            await loadLocalServers();
            fetchServersFromCloud();
          }

          Future<void> fetchServersFromCloud() async {
            try {
              final response = await http.get(Uri.parse('https://raw.githubusercontent.com/minonasa64-jpg/boykt-vpn-app/main/servers.json')).timeout(const Duration(seconds: 4));
              if (response.statusCode == 200) {
                List decoded = jsonDecode(response.body);
                setState(() {
                  servers = decoded.map((e) => Map<String, String>.from(e)).toList();
                });
                saveServers(); // حفظ محلياً للتحديث
                measureAllPings();
              }
            } catch (e) {
              // في حال غياب الإنترنت، يتم الاعتماد على السيرفرات المحلية المتاحة مسبقاً
            }
          }

          Future<void> loadLocalServers() async {
            final prefs = await SharedPreferences.getInstance();
            final String? savedServers = prefs.getString('custom_servers');
            if (savedServers != null) {
              List decoded = jsonDecode(savedServers);
              setState(() {
                servers = decoded.map((e) => Map<String, String>.from(e)).toList();
              });
            } else {
              setState(() {
                servers = [
                  {
                    "name": "Belgium 🇧🇪 (Cloud Run)",
                    "url": "vless://537a1276-0aac-491e-9ba8-315e9be373f0@ryhksn-698624254908.europe-west1.run.app:443?type=ws&security=tls&path=/&sni=youtube.com&alpn=http/1.1&host=ryhksn-698624254908.europe-west1.run.app#Belgium🇧🇪"
                  }
                ];
              });
            }
            measureAllPings();
          }

          Future<void> saveServers() async {
            final prefs = await SharedPreferences.getInstance();
            prefs.setString('custom_servers', jsonEncode(servers));
          }

          // قياس البينغ الحقيقي للسيرفرات
          Future<void> measureAllPings() async {
            for (int i = 0; i < servers.length; i++) {
              try {
                Uri uri = Uri.parse(servers[i]["url"]!);
                String host = uri.host;
                final stopwatch = Stopwatch()..start();
                await http.get(Uri.parse('https://$host')).timeout(const Duration(seconds: 3));
                stopwatch.stop();
                setState(() {
                  serverPings[i] = "${stopwatch.elapsedMilliseconds} ms";
                });
              } catch (e) {
                setState(() {
                  serverPings[i] = "Ready";
                });
              }
            }
          }

          void startTimer() {
            _timerActive = true;
            _secondsConnected = 0;
            _timer?.cancel();
            _timer = Timer.periodic(const Duration(seconds: 1), (timer) {
              setState(() {
                _secondsConnected++;
              });
            });
          }

          void stopTimer() {
            _timerActive = false;
            _timer?.cancel();
            setState(() {
              _secondsConnected = 0;
            });
          }

          String formatTime(int seconds) {
            int m = seconds ~/ 60;
            int s = seconds % 60;
            return "${m.toString().padLeft(2, '0')}:${s.toString().padLeft(2, '0')}";
          }

          void showAdminDialog() {
            TextEditingController nameController = TextEditingController();
            TextEditingController urlController = TextEditingController();

            showDialog(
              context: context,
              builder: (context) => AlertDialog(
                backgroundColor: const Color(0xFF161E2E),
                title: const Text("لوحة تحكم الأدمن السرية", style: TextStyle(color: Colors.white, fontSize: 18)),
                content: Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    TextField(
                      controller: nameController,
                      decoration: const InputDecoration(labelText: "اسم السيرفر", labelStyle: TextStyle(color: Colors.grey)),
                      style: const TextStyle(color: Colors.white),
                    ),
                    const SizedBox(height: 10),
                    TextField(
                      controller: urlController,
                      decoration: const InputDecoration(labelText: "رابط VLESS", labelStyle: TextStyle(color: Colors.grey)),
                      style: const TextStyle(color: Colors.white),
                    ),
                  ],
                ),
                actions: [
                  TextButton(
                    onPressed: () => Navigator.pop(context),
                    child: const Text("إلغاء", style: TextStyle(color: Colors.redAccent)),
                  ),
                  ElevatedButton(
                    style: ElevatedButton.styleFrom(backgroundColor: Colors.blueAccent),
                    onPressed: () {
                      if (nameController.text.isNotEmpty && urlController.text.isNotEmpty) {
                        setState(() {
                          servers.add({
                            "name": nameController.text,
                            "url": urlController.text,
                          });
                        });
                        saveServers();
                        measureAllPings();
                        Navigator.pop(context);
                        ScaffoldMessenger.of(context).showSnackBar(
                          const SnackBar(content: Text("تم إضافة السيرفر بنجاح!")),
                        );
                      }
                    },
                    child: const Text("حفظ"),
                  ),
                ],
              ),
            );
          }

          // زر الاتصال المطور والآمن لمنع انهيار التطبيق
          void toggleVpn() async {
            if (servers.isEmpty) return;
            setState(() {
              isConnecting = true;
            });

            try {
              if (isConnected) {
                await flutterV2ray.stopV2Ray();
              } else {
                if (await flutterV2ray.requestPermission()) {
                  String activeUrl = servers[selectedServerIndex]["url"]!;
                  V2RayURL parser = FlutterV2ray.parseFromURL(activeUrl);
                  await flutterV2ray.startV2Ray(
                    remark: parser.remark.isNotEmpty ? parser.remark : "boykt-vpn",
                    config: parser.getFullConfiguration(),
                  );
                } else {
                  setState(() {
                    isConnecting = false;
                  });
                }
              }
            } catch (e) {
              setState(() {
                isConnecting = false;
                isConnected = false;
              });
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(content: Text("خطأ في الاتصال: $e")),
              );
            }
          }

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              appBar: AppBar(
                backgroundColor: Colors.transparent,
                elevation: 0,
                title: GestureDetector(
                  onTap: () {
                    titleTapCount++;
                    if (titleTapCount >= 5) {
                      titleTapCount = 0;
                      showAdminDialog();
                    }
                  },
                  child: const Text("boykt vpn Pro", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 20)),
                ),
                actions: [
                  // زر التحديث اليدوي للسيرفرات في الأعلى
                  IconButton(
                    icon: const Icon(Icons.refresh, color: Colors.blueAccent),
                    onPressed: () {
                      fetchServersFromCloud();
                      ScaffoldMessenger.of(context).showSnackBar(
                        const SnackBar(content: Text("جاري تحديث السيرفرات...")),
                      );
                    },
                    tooltip: "تحديث السيرفرات",
                  ),
                ],
              ),
              body: Padding(
                padding: const EdgeInsets.symmetric(horizontal: 20.0),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    const SizedBox(height: 10),
                    Center(
                      child: GestureDetector(
                        onTap: toggleVpn,
                        child: AnimatedContainer(
                          duration: const Duration(milliseconds: 300),
                          width: 170,
                          height: 170,
                          decoration: BoxDecoration(
                            shape: BoxShape.circle,
                            color: isConnected ? Colors.green : const Color(0xFF2563EB),
                            boxShadow: [
                              BoxShadow(
                                color: (isConnected ? Colors.green : Colors.blue).withOpacity(0.4),
                                blurRadius: 25,
                                spreadRadius: 5,
                              ),
                            ],
                          ),
                          child: Column(
                            mainAxisAlignment: MainAxisAlignment.center,
                            children: [
                              isConnecting && !isConnected
                                  ? const CircularProgressIndicator(color: Colors.white)
                                  : Icon(
                                      isConnected ? Icons.lock : Icons.public_rounded,
                                      size: 45,
                                      color: Colors.white,
                                    ),
                              const SizedBox(height: 8),
                              Text(
                                isConnecting && !isConnected
                                    ? "Connecting..."
                                    : (isConnected ? formatTime(_secondsConnected) : "Connect"),
                                style: const TextStyle(
                                  color: Colors.white,
                                  fontSize: 16,
                                  fontWeight: FontWeight.bold,
                                ),
                              ),
                            ],
                          ),
                        ),
                      ),
                    ),
                    const SizedBox(height: 35),
                    const Text(
                      "Available Servers",
                      style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.white70),
                    ),
                    const SizedBox(height: 15),
                    Expanded(
                      child: ListView.builder(
                        itemCount: servers.length,
                        itemBuilder: (context, index) {
                          bool isSelected = selectedServerIndex == index;
                          return GestureDetector(
                            onTap: () {
                              setState(() {
                                selectedServerIndex = index;
                              });
                            },
                            child: Container(
                              margin: const EdgeInsets.only(bottom: 12),
                              padding: const EdgeInsets.all(15),
                              decoration: BoxDecoration(
                                color: const Color(0xFF161E2E),
                                borderRadius: BorderRadius.circular(15),
                                border: Border.all(
                                  color: isSelected ? Colors.blueAccent : Colors.transparent,
                                  width: 2,
                                ),
                              ),
                              child: Row(
                                children: [
                                  const Text("🚀", style: TextStyle(fontSize: 28)),
                                  const SizedBox(width: 15),
                                  Expanded(
                                    child: Column(
                                      crossAxisAlignment: CrossAxisAlignment.start,
                                      children: [
                                        Text(
                                          servers[index]["name"]!,
                                          style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 16),
                                        ),
                                        const SizedBox(height: 4),
                                        const Text(
                                          "VLESS / TLS / WebSocket",
                                          style: TextStyle(color: Colors.grey, fontSize: 12),
                                        ),
                                      ],
                                    ),
                                  ),
                                  // عرض مؤشر البينغ (Ping)
                                  Container(
                                    padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 4),
                                    decoration: BoxDecoration(
                                      color: const Color(0xFF1F2937),
                                      borderRadius: BorderRadius.circular(8),
                                    ),
                                    child: Text(
                                      serverPings[index] ?? "...",
                                      style: const TextStyle(color: Colors.greenAccent, fontSize: 12, fontWeight: FontWeight.bold),
                                    ),
                                  ),
                                  const SizedBox(width: 10),
                                  Radio<int>(
                                    value: index,
                                    groupValue: selectedServerIndex,
                                    onChanged: (val) {
                                      setState(() {
                                        selectedServerIndex = val!;
                                      });
                                    },
                                    activeColor: Colors.blueAccent,
                                  ),
                                ],
                              ),
                            ),
                          );
                        },
                      ),
                    ),
                  ],
                ),
              ),
            );
          }
        }
        EOF

    - name: Build APK
      run: |
        cd my_vpn
        flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: boykt-vpn-custom
        path: my_vpn/build/app/outputs/flutter-apk/app-release.apk
